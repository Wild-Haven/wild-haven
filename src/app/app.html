<header class="site-header">
  <nav class="navbar">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <img src="wild_haven_logo.avif" class="brand-logo" />
      <span class="brand-name">Wild Haven</span>
    </a>

    <button
      type="button"
      class="burger-btn"
      [class.open]="isMenuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-menu" [class.open]="isMenuOpen()">
      <ul class="nav-links">
        <li><a routerLink="/" (click)="closeMenu()">Accueil</a></li>
        <li><a routerLink="/evenements" (click)="closeMenu()">Événements</a></li>
        <li><a routerLink="/association" (click)="closeMenu()">L'Association</a></li>
        <li><a routerLink="/contact" (click)="closeMenu()">Contact</a></li>
      </ul>

      <div class="nav-cta">
        <a href="#" class="btn-join" (click)="closeMenu()">Nous rejoindre</a>
      </div>
    </div>
  </nav>
</header>

<router-outlet></router-outlet>

<footer class="site-footer">
  <div class="footer-main">
    <a routerLink="/" class="footer-brand">
      <img src="wild_haven_logo.avif" alt="Logo Wild Haven" class="footer-logo" />
      <span class="brand-name">Wild Haven</span>
    </a>

    <ul class="socials">
      <li>
        <a href="#" target="_blank" rel="noopener" aria-label="Discord" class="socials">
          <img src="icons/discord.svg" alt="Discord" />
        </a>
      </li>
      <li>
        <a href="#" target="_blank" rel="noopener" aria-label="Telegram" class="socials">
          <img src="icons/telegram.svg" alt="Telegram" />
        </a>
      </li>
      <li>
        <a href="#" target="_blank" rel="noopener" aria-label="Instagram" class="socials">
          <img src="icons/instagram.svg" alt="Instagram" />
        </a>
      </li>
    </ul>
  </div>

  <div class="footer-bottom">
    <p>&copy; 2026 Wild Haven — Association Furry à Lyon.</p>
    <ul class="legal-links">
      <li><a routerLink="/mentions-legales">Mentions légales</a></li>
      <li><a routerLink="/charte">Charte de l'association</a></li>
    </ul>
  </div>
</footer>
